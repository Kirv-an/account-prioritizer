<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Account Prioritization Tool{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header>
        <div class="container">
            <h1>Account Prioritization & Research Tool</h1>
            <p class="subtitle">Navan Account Executive Dashboard</p>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 Account Prioritization Tool</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
